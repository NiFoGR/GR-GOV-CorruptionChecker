name: Probe Diavgeia API

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe.py'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe the API
        run: python scripts/probe.py
